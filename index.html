<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino Island — POC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="stage">
      <div id="room">
        <div id="room-bg"></div>
        <div id="hotspots"></div>
        <div id="character">
          <div id="char-inner">
            <svg viewBox="0 0 44 84" width="44" height="84">
              <ellipse cx="22" cy="80" rx="14" ry="4" fill="#000" opacity="0.25"/>
              <rect class="leg leg-l" x="14" y="52" width="8" height="26" rx="3" fill="#33475b"/>
              <rect class="leg leg-r" x="22" y="52" width="8" height="26" rx="3" fill="#233343"/>
              <rect x="10" y="24" width="24" height="32" rx="8" fill="#c94f4f"/>
              <circle cx="22" cy="14" r="12" fill="#e0a877"/>
              <path d="M10 12 Q22 -2 34 12 Q34 4 22 2 Q10 4 10 12" fill="#2b2b2b"/>
            </svg>
          </div>
        </div>
      </div>
      <div id="fade"></div>
      <button id="lang-btn" title="Switch language">FR</button>
      <button id="mute-btn" title="Mute/unmute">🔊</button>
      <div id="save-toast">Saved</div>
    </div>

    <div id="textline"><span id="textline-content">&nbsp;</span></div>

    <div id="dialogue-panel" class="hidden"></div>

    <div id="ui">
      <div id="verbs"></div>
      <div id="inventory"></div>
    </div>

    <div id="title-screen">
      <svg id="title-art" viewBox="0 0 800 620" preserveAspectRatio="xMidYMid slice">
        <g class="raptor-mark" transform="translate(400,300) scale(3.4) rotate(-4)">
          <path d="M0 60 Q10 20 55 15 Q95 12 110 30 L100 40 Q80 30 55 34 Q25 38 15 65 Z" fill="#05070d" opacity="0.26"/>
          <path d="M0 55 Q-30 50 -46 30" stroke="#05070d" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.26"/>
        </g>
        <g class="footprint" transform="translate(560,120) rotate(18)">
          <ellipse cx="0" cy="10" rx="7" ry="11" fill="#05070d" opacity="0.16"/>
          <ellipse cx="-6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.16"/>
          <ellipse cx="0" cy="-9" rx="3" ry="4.5" fill="#05070d" opacity="0.16"/>
          <ellipse cx="6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.16"/>
        </g>
        <g class="footprint" transform="translate(500,190) rotate(10)">
          <ellipse cx="0" cy="10" rx="7" ry="11" fill="#05070d" opacity="0.16"/>
          <ellipse cx="-6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.16"/>
          <ellipse cx="0" cy="-9" rx="3" ry="4.5" fill="#05070d" opacity="0.16"/>
          <ellipse cx="6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.16"/>
        </g>
        <g class="footprint" transform="translate(450,440) rotate(-6)">
          <ellipse cx="0" cy="10" rx="7" ry="11" fill="#05070d" opacity="0.14"/>
          <ellipse cx="-6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.14"/>
          <ellipse cx="0" cy="-9" rx="3" ry="4.5" fill="#05070d" opacity="0.14"/>
          <ellipse cx="6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.14"/>
        </g>
        <g class="footprint" transform="translate(400,500) rotate(-14)">
          <ellipse cx="0" cy="10" rx="7" ry="11" fill="#05070d" opacity="0.14"/>
          <ellipse cx="-6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.14"/>
          <ellipse cx="0" cy="-9" rx="3" ry="4.5" fill="#05070d" opacity="0.14"/>
          <ellipse cx="6" cy="-6" rx="3" ry="4" fill="#05070d" opacity="0.14"/>
        </g>
      </svg>
      <div id="title-content">
        <h1>DINO ISLAND</h1>
        <p class="tagline">A point-and-click prototype</p>
        <div id="title-buttons">
          <button id="btn-continue" class="title-btn hidden">Continue</button>
          <button id="btn-start" class="title-btn">Start</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
